name: Registry Qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed SHA of the protected main dispatch
        required: true
        type: string
      publish:
        description: Request the protected npm job (separate approval required)
        default: false
        type: boolean
      approved_integrity:
        description: Exact sha512-… from the reviewed archive (required only for publish)
        type: string

permissions:
  contents: read

concurrency:
  group: registry-qualification
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.repository == 'outfitter-dev/skillset' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      inputs.source_sha == github.sha &&
      (!inputs.publish || github.run_attempt == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      archive: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 18.0.0
          package-manager-cache: false
      - name: Record the Node floor executable
        run: echo "SKILLSET_REGISTRY_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare archive for review
        if: ${{ !inputs.publish }}
        run: bun scripts/registry-qualification.ts prepare "$GITHUB_SHA" "$RUNNER_TEMP/registry"
      - name: Rebuild the reviewed archive
        if: inputs.publish
        env:
          REGISTRY_APPROVED_INTEGRITY: ${{ inputs.approved_integrity }}
        run: bun scripts/registry-qualification.ts prepare "$GITHUB_SHA" "$RUNNER_TEMP/registry"
      - name: Upload checked archive and review receipt
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-review-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.run_attempt == '1'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --location=global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.12.1
      - name: Download this run's reviewed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.preflight.outputs.archive }}
          path: ${{ runner.temp }}/registry/
      - name: Publish once and verify signed public evidence
        env:
          REGISTRY_APPROVED_INTEGRITY: ${{ inputs.approved_integrity }}
        run: bun scripts/registry-qualification.ts publish "$GITHUB_SHA" "$RUNNER_TEMP/registry"
      - name: Upload public integrity and provenance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-publication-${{ github.sha }}
          path: ${{ runner.temp }}/registry/publication.json
          if-no-files-found: error

  consumers:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 18.0.0
          package-manager-cache: false
      - name: Record the Node floor executable
        run: echo "SKILLSET_REGISTRY_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the exact public version in clean consumers
        env:
          REGISTRY_APPROVED_INTEGRITY: ${{ inputs.approved_integrity }}
        run: bun scripts/registry-qualification.ts verify-consumers "$GITHUB_SHA" "$RUNNER_TEMP/registry-consumers.json"
      - name: Upload consumer receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-consumers-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-consumers.json
          if-no-files-found: error
