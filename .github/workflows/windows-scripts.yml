# Pull-request coverage for scripts that branch on Windows. Non-required until
# it has been reliably green; the monthly Native workflow stays the full canary.
# Only test files known or reasoned to pass on Windows are listed. POSIX-only
# suites (bootstrap.test.ts shell fixtures, runtime-hooks.test.ts extensionless
# fake commands) stay out until they are made Windows-aware.
name: Windows scripts

on:
  pull_request:
    paths:
      - .github/workflows/windows-scripts.yml
      - scripts/bootstrap.sh
      - scripts/bootstrap/**
      - scripts/pinned-bun.ts
      - scripts/__tests__/pinned-bun.test.ts
      - scripts/test-shard-workspace.ts
      - scripts/__tests__/test-shard-workspace.test.ts
      - packages/core/src/path.ts
      - packages/core/src/__tests__/diagnostic-path.test.ts
      - apps/skillset/src/__tests__/cli-diagnostic-paths.test.ts

permissions:
  contents: read

jobs:
  scripts:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The sandbox resolves the pinned Bun into the win32 cache before any
      # test runs, which is itself the proof for pinned-bun.ts on Windows.
      - name: Run Windows-branching script tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          bun run test:focused --
          scripts/__tests__/pinned-bun.test.ts
          scripts/__tests__/test-shard-workspace.test.ts
          packages/core/src/__tests__/diagnostic-path.test.ts
          apps/skillset/src/__tests__/cli-diagnostic-paths.test.ts
      - name: Bootstrap doctor finds the cached pin under Git Bash without a global Bun
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/no-global-bun"
          BUN_INSTALL="$RUNNER_TEMP/no-global-bun" PATH="/mingw64/bin:/usr/bin:/bin" \
            bash scripts/bootstrap.sh doctor 2>&1 | tee "$RUNNER_TEMP/doctor.log"
          grep -q "bun: ok" "$RUNNER_TEMP/doctor.log"
