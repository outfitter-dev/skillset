name: Provider Validation

on:
  pull_request:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      # No git operation follows checkout, so the job token is never persisted
      # into .git/config where pinned third-party validators could read it.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.19.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          version: "0.12.5"
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Acquire exact validators and validate generated outputs
        run: bun run providers:validate:hosted -- --report "$RUNNER_TEMP/provider-validation.md"
      - name: Add provider evidence to the job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/provider-validation.md" ]; then
            cat "$RUNNER_TEMP/provider-validation.md" >> "$GITHUB_STEP_SUMMARY"
          fi
