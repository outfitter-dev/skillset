name: Release

# The pull_request trigger exists so GitHub's workflow compiler — not just
# actionlint — parses this file before it reaches main. actionlint cannot
# validate reusable-workflow permission inheritance, which is how a missing
# `attestations: read` on the Homebrew caller reached main and produced
# startup_failure on every push (2026-08-12). Every job below is gated on
# `github.ref == 'refs/heads/main'`, directly or transitively via `needs`,
# so a pull_request run instantiates each job and then skips it without
# entering any publish, signing, attestation, or Homebrew mutation step.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version Packages
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.pending-changesets.outputs.has_changesets }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check for pending changesets
        id: pending-changesets
        shell: bash
        run: |
          status_file="$RUNNER_TEMP/changeset-status.json"
          bun changeset status --output "$status_file"
          has_releases="$(bun -e 'const status = await Bun.file(process.argv[1]).json(); console.log(status.releases.length > 0 ? "true" : "false");' "$status_file")"
          echo "has_changesets=$has_releases" >> "$GITHUB_OUTPUT"
      - name: Create or update version PR
        id: changesets
        if: steps.pending-changesets.outputs.has_changesets == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          version: bun run version:packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Label version PR
        if: steps.pending-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run publish:label-release-pr
      - name: Trigger version PR CI
        if: steps.pending-changesets.outputs.has_changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main

  publish-plan:
    name: Publish Plan
    needs: version
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.plan.outputs.name }}
      partial_release: ${{ steps.plan.outputs.partial_release }}
      registry_complete: ${{ steps.plan.outputs.registry_complete }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      version_commit: ${{ steps.plan.outputs.version_commit }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check coordinated registry state
        id: plan
        run: bun run publish:plan

  publish-policy:
    name: Publish Policy
    needs: publish-plan
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.publish-plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      create_github_release: ${{ steps.policy.outputs.create_github_release }}
      decision: ${{ steps.policy.outputs.decision }}
      publish: ${{ steps.policy.outputs.publish }}
      release: ${{ steps.policy.outputs.release }}
      should_publish: ${{ steps.policy.outputs.should_publish }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Resolve publish policy
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SKILLSET_RELEASE_POLICY_CI_ATTEMPTS: "30"
          SKILLSET_RELEASE_POLICY_CI_WAIT_MS: "10000"
        run: bun run publish:policy

  signing-policy:
    name: Resolve macOS Signing Policy
    needs: [publish-plan, publish-policy]
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.publish-policy.outputs.create_github_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.publish-plan.outputs.version_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Fail closed unless the signing policy is explicit
        env:
          SKILLSET_MACOS_SIGNING_POLICY: ${{ vars.SKILLSET_MACOS_SIGNING_POLICY }}
        run: bun run release:signing-check

  native-evidence:
    name: Build and Smoke Native Release
    needs: [publish-plan, publish-policy, signing-policy]
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.signing-policy.result == 'success'
    uses: ./.github/workflows/native.yml
    with:
      artifact-name: skillset-native-${{ needs.publish-plan.outputs.version_commit }}
      source-sha: ${{ needs.publish-plan.outputs.version_commit }}
    permissions:
      contents: read

  attest-native:
    name: Attest Native Release Assets
    needs: [publish-plan, publish-policy, native-evidence]
    if: needs.native-evidence.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.publish-plan.outputs.version_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: skillset-native-${{ needs.publish-plan.outputs.version_commit }}
          path: ${{ runner.temp }}/native
      - name: Stage exact release asset set
        run: bun run release:assets -- stage --native-out-dir "$RUNNER_TEMP/native" --release-dir "$RUNNER_TEMP/release-assets"
      - name: Attest exact release asset set
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/release-assets/skillset-v*
      - name: Verify required attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in "$RUNNER_TEMP"/release-assets/skillset-v*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done

  publish-auto:
    name: Publish coordinated set to npm automatically
    needs: [publish-plan, publish-policy, attest-native]
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.attest-native.result == 'success' && needs.publish-plan.outputs.should_publish == 'true' && needs.publish-plan.outputs.partial_release != 'true' && needs.publish-policy.outputs.decision == 'auto' && needs.publish-policy.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-auto
    permissions:
      attestations: read
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.publish.outputs.name }}
      published: ${{ steps.publish.outputs.published }}
      registry_complete: ${{ steps.publish.outputs.registry_complete }}
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.publish-plan.outputs.version_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --location=global npm@11.12.1
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: skillset-native-${{ needs.publish-plan.outputs.version_commit }}
          path: ${{ runner.temp }}/native
      - name: Validate coordinated release before publish
        run: |
          bun run release:assets -- stage --native-out-dir "$RUNNER_TEMP/native" --release-dir "$RUNNER_TEMP/release-assets"
          for asset in "$RUNNER_TEMP"/release-assets/skillset-v*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
          bun run publish:release-check -- --native-out-dir "$RUNNER_TEMP/native" --stage-dir "$RUNNER_TEMP/release-tarballs"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish package set
        id: publish
        run: bun run publish:packages -- --native-out-dir "$RUNNER_TEMP/native" --stage-dir "$RUNNER_TEMP/release-tarballs"

  publish:
    name: Publish coordinated set to npm manually
    needs: [publish-plan, publish-policy, attest-native]
    if: github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.attest-native.result == 'success' && needs.publish-plan.outputs.should_publish == 'true' && needs.publish-policy.outputs.should_publish == 'true' && (needs.publish-policy.outputs.decision == 'manual' || (needs.publish-policy.outputs.decision == 'auto' && needs.publish-plan.outputs.partial_release == 'true'))
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      attestations: read
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.publish.outputs.name }}
      published: ${{ steps.publish.outputs.published }}
      registry_complete: ${{ steps.publish.outputs.registry_complete }}
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.publish-plan.outputs.version_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --location=global npm@11.12.1
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: skillset-native-${{ needs.publish-plan.outputs.version_commit }}
          path: ${{ runner.temp }}/native
      - name: Validate coordinated release before publish
        run: |
          bun run release:assets -- stage --native-out-dir "$RUNNER_TEMP/native" --release-dir "$RUNNER_TEMP/release-assets"
          for asset in "$RUNNER_TEMP"/release-assets/skillset-v*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
          bun run publish:release-check -- --native-out-dir "$RUNNER_TEMP/native" --stage-dir "$RUNNER_TEMP/release-tarballs"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish package set
        id: publish
        run: bun run publish:packages -- --native-out-dir "$RUNNER_TEMP/native" --stage-dir "$RUNNER_TEMP/release-tarballs"

  github-release:
    name: Create or Reconcile GitHub Release
    needs: [publish-plan, publish-policy, attest-native, publish-auto, publish]
    if: always() && github.repository == 'outfitter-dev/skillset' && github.ref == 'refs/heads/main' && needs.attest-native.result == 'success' && needs.publish-policy.outputs.create_github_release == 'true' && (needs.publish-plan.outputs.registry_complete == 'true' || needs.publish-auto.outputs.registry_complete == 'true' || needs.publish.outputs.registry_complete == 'true')
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
    permissions:
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.publish-plan.outputs.version_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --location=global npm@11.12.1
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: skillset-native-${{ needs.publish-plan.outputs.version_commit }}
          path: ${{ runner.temp }}/native
      - name: Verify release evidence and complete registry set
        env:
          GH_TOKEN: ${{ github.token }}
          SKILLSET_MACOS_SIGNING_POLICY: ${{ vars.SKILLSET_MACOS_SIGNING_POLICY }}
        run: |
          bun run release:signing-check
          bun run release:assets -- stage --native-out-dir "$RUNNER_TEMP/native" --release-dir "$RUNNER_TEMP/release-assets"
          for asset in "$RUNNER_TEMP"/release-assets/skillset-v*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
          bun run publish:release-check -- --native-out-dir "$RUNNER_TEMP/native" --stage-dir "$RUNNER_TEMP/release-tarballs"
          bun run publish:registry-check:published -- --stage-dir "$RUNNER_TEMP/release-tarballs"
      - name: Create or reconcile tag and GitHub release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish-auto.outputs.version || needs.publish.outputs.version || needs.publish-plan.outputs.version }}
          VERSION_COMMIT: ${{ needs.publish-plan.outputs.version_commit }}
          DIST_TAG: ${{ needs.publish-auto.outputs.tag || needs.publish.outputs.tag || needs.publish-plan.outputs.tag }}
        run: |
          create_args=()
          if [ "$DIST_TAG" != "latest" ]; then
            create_args+=(--prerelease --latest=false)
          else
            create_args+=(--latest)
          fi

          tag="v$VERSION"
          echo "channel=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          notes="Published the seven-package Skillset $VERSION set to npm with dist-tag \`$DIST_TAG\`."
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_target="$(git rev-list -n 1 "$tag")"
            if [ "$tag_target" != "$VERSION_COMMIT" ]; then
              echo "$tag points to $tag_target, expected $VERSION_COMMIT" >&2
              exit 1
            fi
          else
            git tag "$tag" "$VERSION_COMMIT"
            git push origin "refs/tags/$tag"
          fi

          release_dir="$RUNNER_TEMP/release-assets"
          if gh release view "$tag" >/dev/null 2>&1; then
            remote_dir="$RUNNER_TEMP/existing-release-assets"
            mkdir -p "$remote_dir"
            asset_count="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [ "$asset_count" -gt 0 ]; then
              gh release download "$tag" --dir "$remote_dir"
            fi
            missing_file="$RUNNER_TEMP/missing-release-assets.txt"
            bun run release:assets -- reconcile --local-dir "$release_dir" --remote-dir "$remote_dir" --version "$VERSION" --missing-output "$missing_file"
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              gh release upload "$tag" "$release_dir/$name"
            done < "$missing_file"
          else
            gh release create "$tag" "$release_dir"/* \
              --verify-tag \
              --title "skillset v$VERSION" \
              --notes "$notes" \
              "${create_args[@]}"
          fi

          final_dir="$RUNNER_TEMP/final-release-assets"
          mkdir -p "$final_dir"
          gh release download "$tag" --dir "$final_dir"
          final_missing="$RUNNER_TEMP/final-missing-release-assets.txt"
          bun run release:assets -- reconcile --local-dir "$release_dir" --remote-dir "$final_dir" --version "$VERSION" --missing-output "$final_missing"
          if [ -s "$final_missing" ]; then
            echo "GitHub release $tag is still missing assets" >&2
            cat "$final_missing" >&2
            exit 1
          fi

  homebrew:
    name: Update Homebrew tap
    needs: github-release
    if: needs.github-release.result == 'success' && needs.github-release.outputs.channel == 'latest'
    uses: ./.github/workflows/publish-homebrew.yml
    permissions:
      attestations: read
      contents: read
    with:
      tag: ${{ needs.github-release.outputs.tag }}
