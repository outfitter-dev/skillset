name: Native

on:
  pull_request:
    paths:
      - .bun-version
      - .github/workflows/native.yml
      - apps/cli/**
      - apps/native-*/**
      - apps/skillset/**
      - packages/**
      - scripts/native*.ts
      - scripts/native-*.ts
      - scripts/native-size-baseline.json
      - bun.lock
      - package.json
  workflow_dispatch: {}
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact name shared with the calling release workflow
        required: false
        type: string
      source-sha:
        description: Exact source commit used for release evidence
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build reproducible required artifacts
        run: bun run build:native -- --required --reproducible --out-dir "$RUNNER_TEMP/native"
      - name: Verify release-shaped artifact contract
        run: bun run native:check -- --out-dir "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact-name || format('skillset-native-{0}', github.event.pull_request.head.sha || github.sha) }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: darwin-arm64
          - runner: macos-15-intel
            suffix: darwin-x64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64-glibc
          - runner: ubuntu-24.04
            suffix: linux-x64-glibc
          - runner: windows-2025
            suffix: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Prove atomic no-replace directory rename
        run: bun test packages/core/src/__tests__/directory-rename-no-replace.test.ts
      - name: Prove workspace transaction directory race
        run: bun test packages/core/src/__tests__/workspace-transaction.test.ts --test-name-pattern "allows exactly one competing directory transaction"
      - name: Prove packaged atomic no-replace directory rename
        run: bun scripts/native-directory-rename-smoke.ts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.artifact-name || format('skillset-native-{0}', github.event.pull_request.head.sha || github.sha) }}
          path: ${{ runner.temp }}/native
      - name: Run target-host smoke without system Bun in the child PATH
        run: bun run native:smoke -- --target ${{ matrix.suffix }} --out-dir "${{ runner.temp }}/native"
      - name: Prove npm global install, platform selection, and reinstall
        run: |
          bun run build:npm
          bun run native:global-smoke -- --target ${{ matrix.suffix }} --native-out-dir "${{ runner.temp }}/native"
