name: Native

on:
  pull_request:
    paths:
      - .bun-version
      - .github/workflows/native.yml
      - apps/cli/**
      - apps/skillset/**
      - packages/**
      - scripts/native*.ts
      - scripts/native-*.ts
      - scripts/native-size-baseline.json
      - bun.lock
      - package.json
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build reproducible required artifacts
        run: bun run build:native -- --required --reproducible --out-dir "$RUNNER_TEMP/native"
      - name: Verify release-shaped artifact contract
        run: bun run native:check -- --out-dir "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillset-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            suffix: darwin-arm64
          - runner: macos-15-intel
            suffix: darwin-x64
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64-glibc
          - runner: ubuntu-24.04
            suffix: linux-x64-glibc
          - runner: windows-2025
            suffix: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: skillset-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native
      - name: Run target-host smoke without system Bun in the child PATH
        run: bun run native:smoke -- --target ${{ matrix.suffix }} --out-dir "${{ runner.temp }}/native"
