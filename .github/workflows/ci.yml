# Repo CI plus a dogfood of the `skillset check --ci` workflow that
# `skillset init --include ci` scaffolds for adopting repos. The skillset-ci job
# mirrors that template but runs the compiler from this repo's source.
# Notes:
# - Invariant: skillset-ci only concludes success when a gate actually ran —
#   either `skillset check --ci` or, for generated release pull requests, the
#   release package check. Stack position never skips the gate.
# - Non-boundary stack pull requests (those with open child pull requests) run
#   the gate read-only: no `--fix`, no mechanical-fix push, because rewriting a
#   parent branch head mid-stack forces every child to restack.
# - Mechanical fixes pushed with GITHUB_TOKEN do not retrigger workflows; if
#   branch protection requires checks on the fixed commit, push with a PAT instead.
# - The comment step prefers gh >= 2.68 (--create-if-none) and falls back to a new comment.
# - merge_group runs the required checks on the merge queue's candidate commit,
#   read-only like push: no --fix, no mechanical-fix push, no PR comment.
# - A queued generated release PR (changeset-release/main) runs the release
#   package check on its candidate commit, as it does on its PR head; the
#   source Changeset gate would reject its version bumps.
# - Draft pull requests run the fast tier (`bun run check:fast`) instead of the
#   full `bun run check`; the full gate runs once a pull request is ready for
#   review and again on the merge queue's candidate commit, which is what gates
#   the merge. Contributors verify drafts locally with `bun run verify`.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes its older runs, so cancel them.
# Other events group by commit, so queued main runs never displace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changeset:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check changeset coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-status "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"
          bun run changeset:check -- --changed-files "$RUNNER_TEMP/changed-files.txt"

  fast:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check:fast

  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check

  skillset-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout same-repo pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Checkout fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout push
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Detect stack boundary
        id: stack
        if: github.event_name == 'pull_request'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          child_count="$(gh pr list --repo "$GH_REPO" --state open --base "$HEAD_REF" --json number --jq 'length')"
          echo "child_count=$child_count" >> "$GITHUB_OUTPUT"

          if [ "$child_count" != "0" ]; then
            echo "read_only=true" >> "$GITHUB_OUTPUT"
            echo "Running skillset check --ci read-only (no --fix) on non-boundary stack PR with $child_count child PR(s)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "read_only=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect generated release head
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GIT_REF: ${{ github.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          QUEUE_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          is_release=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              [ "$GIT_REF" = "refs/heads/changeset-release/main" ] && is_release=true
              ;;
            pull_request)
              [ "$PR_HEAD_REF" = "changeset-release/main" ] && [ "$PR_HEAD_REPO" = "$GH_REPO" ] && is_release=true
              ;;
            merge_group)
              # Queue refs look like refs/heads/gh-readonly-queue/<base>/pr-<number>-<sha>.
              pr_number="$(printf '%s' "$QUEUE_HEAD_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$#\1#p')"
              if [ -n "$pr_number" ]; then
                pr_head="$(gh pr view "$pr_number" --repo "$GH_REPO" --json headRefName,headRepository,headRepositoryOwner --jq '"\(.headRepositoryOwner.login)/\(.headRepository.name) \(.headRefName)"')"
                [ "$pr_head" = "$GH_REPO changeset-release/main" ] && is_release=true
              fi
              ;;
          esac
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
      - name: Check generated release package
        id: release_package
        if: steps.release.outputs.is_release == 'true'
        run: bun scripts/publish.ts check
      - name: Run skillset check --ci
        id: skillset
        if: steps.release.outputs.is_release != 'true'
        run: >-
          bun run test:sandbox -- bun ./apps/skillset/src/cli.ts check --ci
          ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.stack.outputs.read_only != 'true' && '--fix' || '' }}
          --report "$RUNNER_TEMP/skillset-ci-report.md"
        continue-on-error: true
      - name: Add report to job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/skillset-ci-report.md" ]; then
            cat "$RUNNER_TEMP/skillset-ci-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Push mechanical fixes
        if: steps.stack.outputs.read_only != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(skillset): rebuild generated output"
          git push origin "HEAD:$HEAD_REF"
      - name: Comment report on PR
        if: steps.skillset.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --edit-last --create-if-none \
            --body-file "$RUNNER_TEMP/skillset-ci-report.md" \
          || gh pr comment "$PR_NUMBER" --repo "$GH_REPO" \
            --body-file "$RUNNER_TEMP/skillset-ci-report.md"
      - name: Fail when the gate did not run or problems remain
        if: ${{ !cancelled() }}
        env:
          SKILLSET_OUTCOME: ${{ steps.skillset.outcome }}
          RELEASE_PACKAGE_OUTCOME: ${{ steps.release_package.outcome }}
        run: |
          if [ "$SKILLSET_OUTCOME" = "failure" ]; then
            echo "skillset check --ci reported problems." >&2
            exit 1
          fi
          if [ "$SKILLSET_OUTCOME" != "success" ] && [ "$RELEASE_PACKAGE_OUTCOME" != "success" ]; then
            echo "No gate ran: skillset check --ci did not execute and the release package check did not succeed." >&2
            exit 1
          fi
