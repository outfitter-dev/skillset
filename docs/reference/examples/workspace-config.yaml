# yaml-language-server: $schema=https://raw.githubusercontent.com/outfitter-dev/skillset/main/docs/reference/schemas/0.1.0/workspace-config.schema.json
changes:
  minimumRefLength: 6
claude:
  skills:
    enabled: true
    include:
      - use-skillset
codex:
  plugins: true
  skills:
    - use-skillset
compile:
  build: updated
  features:
    promptArguments: true
  instruction_front_page: claude-dir
  session_start_hook: auto
  skillset:
    metadata: true
  targets:
    - claude
    - codex
    - cursor
  unsupportedDestination: error
cursor: true
defaults:
  claude:
    skills:
      model: sonnet
  codex:
    agents:
      model: gpt-5.1-codex
    plugins:
      enabled: true
    rules:
      enabled: true
dependencies:
  plugins:
    - acme-tools
    - marketplace: acme
      name: docs
      plugin: docs
      range: ^2.4.0
      unversioned: false
distributions:
  codex-marketplace:
    from:
      runtime: codex-cli
      selector: plugin:outfitter-core
      target: codex
    to:
      kind: local
      path: ../openai-codex-plugins/outfitter-core
drafts:
  - plugin.skillset.skill:experimental
internal_marker: true
marketplaces:
  outfitter:
    description: Curated Outfitter provider plugins.
    plugins:
      - codex:
          interface:
            displayName: Outfitter Core
            logo: ./assets/logo.svg
            shortDescription: Core Outfitter workflows.
          policy:
            authentication: ON_USE
            installation: AVAILABLE
            products: []
          source:
            path: ./plugins/outfitter-core
            source: local
        plugin: outfitter-core
      - channel: latest
        codex:
          source:
            ref: main
            sha: 0123456789abcdef0123456789abcdef01234567
            source: url
            url: github:outfitter-dev/trails
        plugin: trails-review
        repo: github:outfitter-dev/trails
      - codex:
          source:
            path: ./plugins/skillset
            source: git-subdir
            url: github:outfitter-dev/skillset
        plugin: skillset
        ref: main
        repo: github:outfitter-dev/skillset
        targets:
          - claude
      - codex:
          author:
            name: Outfitter
          description: Published npm plugin fallback.
          homepage: https://example.com/npm-plugin
          keywords:
            - agents
            - plugin
          source:
            package: "@outfitter/npm-plugin"
            registry: https://registry.npmjs.org
            source: npm
            version: latest
          version: 1.2.3
        plugin: npm-plugin
    targets:
      - claude
      - codex
      - cursor
    title: Outfitter
plugins:
  internal_use:
    drafts:
      skillset:
        - experimental
    plugins:
      - skillset
    skills:
      skillset:
        - "!legacy-review"
  output:
    codex:
      path: plugins/[name]
    path: plugins/[name]
skillset:
  author:
    email: team@example.com
    name: Example Team
  description: Source-first agent loadout for the example team.
  homepage: https://example.com/skillset
  keywords:
    - agents
    - docs
  license: MIT
  listing:
    capabilities:
      - Read
      - Write
    category: Developer Tools
    display_name: Example Team
    summary: Example team Skillset source.
  name: example-team
  preprocess: true
  repository: https://github.com/example/team-skillset
  schema: 1
  strict: true
supports:
  packages:
    - "@acme/docs-cli >=2.4.0 <3.0.0"
    - name: "@acme/api"
      onMismatch: warn
      range: ^1.0.0
      source: repo:package.json
workspace:
  cacheKey: example-team
  nativeAgents: true
