skillset:
  name: authoring-model
compile:
  session_start_hook: on
  # Retained for project-use shared content and Cursor root instructions.
  # Wildcard rules themselves build under the default error policy.
  unsupportedDestination: warn
claude: true
codex: true
cursor: true
drafts: []
internal_marker: true
plugins:
  internal_use:
    drafts:
      mg-skills: override
    plugins:
      - mg-skills
    skills:
      mg-skills:
        - "!proofread"
