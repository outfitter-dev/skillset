# NOTE: `GIT_PAGER: cat` is set on every leaf job. Lefthook attaches a PTY to
# render hook output, which can make child `git` processes think stdout is an
# interactive terminal. Contributors with a configured pager can then hang when
# a stage invokes `git diff` / `git grep` / etc. Forcing `GIT_PAGER=cat` keeps
# hook-time git commands non-interactive. Hook-level `env` does not propagate
# to job children, so it must be set per-job.

pre-commit:
  piped: true
  jobs:
    - name: repo-sanity
      env:
        GIT_PAGER: cat
      run: |
        test "$(git config --default false core.bare)" = "false" || { echo "core.bare is true — a concurrent tool corrupted .git/config and checkouts will fail; repair with 'git config core.bare false'"; exit 1; }
    - name: whitespace
      env:
        GIT_PAGER: cat
      run: git diff --cached --check
    - name: skillset
      env:
        GIT_PAGER: cat
      # Every generated root plus the source and config that feed them. Keep in
      # step with the paths the committed skillset.lock files record.
      glob: "{.skillset/**,skillset.yaml,skillset.lock,.agents/**,.claude/**,.codex/**,.cursor/**,.claude-plugin/**,.cursor-plugin/**,plugins/**,AGENTS.md,**/AGENTS.md}"
      run: bun run skillset:check:outputs
    - name: workflows
      env:
        GIT_PAGER: cat
      glob: ".github/workflows/*.{yml,yaml}"
      run: bun run check:workflows

# Pre-push no longer runs the full gate. `bun run verify` runs it ahead of time
# against exact commits and records a receipt per tree; `scripts/pre-push.ts`
# reads git's pushed-ref lines and, per ref, checks whitespace against trunk and
# looks for a receipt. A clean checked-out ref without one gets the fast tier
# (`bun run check:fast`). Hosted CI still runs the full gate before any merge.
pre-push:
  piped: true
  jobs:
    - name: repo-sanity
      env:
        GIT_PAGER: cat
      run: |
        test "$(git config --default false core.bare)" = "false" || { echo "core.bare is true — a concurrent tool corrupted .git/config and checkouts will fail; repair with 'git config core.bare false'"; exit 1; }
    - name: changesets
      env:
        GIT_PAGER: cat
      run: bun run changeset:check
    - name: workflows
      env:
        GIT_PAGER: cat
      run: bun run check:workflows
    - name: refs
      env:
        GIT_PAGER: cat
      use_stdin: true
      run: env -u SKILLSET_TEST_SANDBOX bun scripts/pre-push.ts
